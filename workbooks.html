<html lang="en">

<style>
    /* (all styles – same as before, copy from the previous full version) */
    :root {
        --bg: #f1f3f8;
        --panel-bg: #ffffff;
        --text: #1c2230;
        --text-secondary: #5b6478;
        --border: #dde1ea;

        --success: #16a34a;
        --info: #2563eb;
        --equ-tile: #316A9E;
    }
    .dark {
        --bg: #14161f;
        --panel-bg: #1d2030;
        --text: #e4e6ef;
        --text-secondary: #a0a5b8;
        --border: #333750;

        --accent-light: #2a2860;
        --btn-bg: #262a3d;
        --btn-hover: #313650;
        --shadow: 0 2px 8px rgba(0,0,0,0.35);
        --danger: #f87171;
        --success: #4ade80;
        --info: #60a5fa;

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.3s,color 0.3s;display:flex;flex-direction:column}

    .solution-panel-body{padding:14px 16px;max-height:38vh;overflow-y:auto;font-size:0.92rem;line-height:1.5}

    .solution-panel-hidden-strip{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;background:rgba(47,143,78,0.08);border:1px dashed #2f8f4e;border-radius:var(--radius-sm);margin:10px 16px 0;flex-shrink:0;cursor:pointer;color:#2f8f4e;font-size:0.82rem;font-weight:700}

    .question-editable table{border-collapse:collapse;max-width:100%}

    .guide-modal{background:var(--panel-bg);border-radius:var(--radius);padding:24px 28px;max-width:600px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.3);border:1px solid var(--border);max-height:85vh;overflow-y:auto}
    .guide-modal h2{margin-bottom:4px}
    .guide-modal .guide-sub{font-size:0.85rem;color:var(--text-secondary);margin-bottom:18px}
    .guide-step{display:flex;gap:12px;margin-bottom:16px}
    .guide-step .g-icon{font-size:1.3rem;flex-shrink:0;width:32px;text-align:center}
    .guide-step .g-text h4{font-size:0.92rem;margin-bottom:3px}
    .guide-step .g-text p{font-size:0.82rem;color:var(--text-secondary);line-height:1.45}
    .guide-close-btn{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font-weight:600;font-size:0.9rem;margin-top:8px;font-family:var(--font)}
    .guide-btn{padding:6px 10px;border:1px solid var(--border);border-radius:50%;background:var(--btn-bg);color:var(--text);cursor:pointer;font-weight:700;width:32px;height:32px;font-family:var(--font)}

    @media(max-width:600px){.content-area{padding:16px 12px}.breadcrumb{padding:8px 14px}}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

function newId() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function newSheet(name) { return { id: newId(), name: name, content: '', prompt: '', promptVisible: true, solution: '', solutionVisible: false }; }
function newSubject(name) { return { id: newId(), name, sheets: [newSheet('Sheet 1')] }; }

/* ---- Starter packs (workbook-templates/) ----
 * One-time seeding: brand-new, genuinely empty workbooks get pre-populated
 * from whatever's in workbook-templates/manifest.json. Adding more content
 * later is a pure data change (drop a new JSON file, add its name to
 * manifest.json) — this function never needs to change again.
 *
 * Deliberately NOT run when cloud data is merely unreachable (vs. confirmed
 * empty) — seeding into an "offline, unsure" state risks a real workbook
 * getting silently overwritten once connectivity returns and autosave
 * pushes the seeded placeholder to the cloud.
 */
async function loadStarterPacks(track) {
    try {
        const manifestRes = await fetch('workbook-templates/manifest.json?v=20260824');
        if (!manifestRes.ok) return [];
        const entries = await manifestRes.json();
        const subjects = [];
        for (const entry of entries) {
            // Support both the old flat-string manifest shape and the new
            // { file, tracks } shape, so nothing breaks if manifest.json
            // ever reverts to a plain filename list.
            const filename = typeof entry === 'string' ? entry : entry.file;
            const entryTracks = typeof entry === 'string' ? null : entry.tracks;
            if (!filename) continue;

            // Track scoping: only seed a pack if it applies to this user's track.
            // If the pack has no "tracks" field, treat it as shared (always seeded).
            // If we don't know the user's track (e.g. guest, not signed in),
            // only seed packs shared across every track — never guess.
            if (Array.isArray(entryTracks)) {
                if (track) {
                    if (!entryTracks.includes(track)) continue;
                } else {
                    if (entryTracks.length < 2) continue;
                }
            }

            try {
                const res = await fetch('workbook-templates/' + filename + '?v=20260824');
                if (!res.ok) continue;
                const pack = await res.json();
                if (!pack.subjectName || !Array.isArray(pack.sheets)) continue;
                subjects.push({
                    id: newId(),
                    name: pack.subjectName,
                    sheets: pack.sheets.map(s => ({
                        id: newId(),
                        name: s.sheetName || 'Sheet',
                        content: '',
                        prompt: s.question || '',
                        promptVisible: true,
                        solution: s.solution || '',
                        solutionVisible: false
                    }))
                });
            } catch (e) {
                console.warn('Starter pack failed to load:', filename, e);
            }
        }
        return subjects;
    } catch (e) {
        console.warn('Starter packs unavailable:', e);
        return [];
    }
}

const EQU_TABS = {
    Operators: ['\\cdot', '\\times', '*', '\\div', '\\diamond', '\\pm', '\\mp', '\\oplus', '\\ominus', '\\otimes',
        '\\oslash', '\\odot', '\\circ', '\\bullet', '\\asymp', '\\equiv', '\\subseteq', '\\supseteq', '\\le', '\\ge',
        '\\preccurlyeq', '\\succcurlyeq', '\\sim', '\\simeq', '\\approx', '\\subset', '\\supset', '\\ll', '\\gg', '\\prec',
        '\\succ', '\\infty', '\\in', '\\ni', '\\forall', '\\exists', '\\neq'],
    Arrows: ['\\leftarrow', '\\rightarrow', '\\uparrow', '\\downarrow', '\\leftrightarrow', '\\Leftarrow', '\\Rightarrow',
        '\\Uparrow', '\\Downarrow', '\\Leftrightarrow', '\\mapsto', '\\hookleftarrow', '\\hookrightarrow', '\\nearrow',
        '\\searrow', '\\swarrow', '\\nwarrow', '\\longrightarrow', '\\longleftarrow', '\\rightharpoonup'],
    'Greek symbols': ['\\alpha', '\\beta', '\\gamma', '\\delta', '\\epsilon', '\\zeta', '\\eta', '\\theta', '\\iota',
        '\\kappa', '\\lambda', '\\mu', '\\nu', '\\xi', '\\pi', '\\rho', '\\sigma', '\\tau', '\\upsilon', '\\phi',
        '\\chi', '\\psi', '\\omega', '\\Gamma', '\\Delta', '\\Theta', '\\Lambda', '\\Xi', '\\Pi', '\\Sigma',
        '\\Upsilon', '\\Phi', '\\Psi', '\\Omega'],
    Advanced: ['\\sum', '\\prod', '\\int', '\\oint', '\\partial', '\\nabla', '\\sqrt{}', '\\frac{}{}', '\\lim',
        '\\binom{}{}', '^{}', '_{}', '\\overline{}', '\\underline{}', '\\vec{}', '\\hat{}', '\\dot{}', '\\ldots',
        '\\cdots', '\\prime']
};

function App() {
    // --- State ---
    const [darkMode, setDarkMode] = useState(() => localStorage.getItem('wb_dark') === 'true');
    const [userId, setUserId] = useState(() => localStorage.getItem('wb_user') || '');
    const [uid, setUid] = useState(null); // Firebase Auth uid, once signed in
    const [userTrack, setUserTrack] = useState(null); // 'grad' | 'retail' | null, from users/{uid} profile
    const [isHubLogin, setIsHubLogin] = useState(false);
    // True once we've definitively finished checking for a hub login (prevents loader race)
    const [loginResolved, setLoginResolved] = useState(false);
    const [syncStatus, setSyncStatus] = useState('');
    const [saveStatus, setSaveStatus] = useState('');
    // Flag to indicate that initial data has been loaded into state
    const [loaded, setLoaded] = useState(false);

    const [data, setData] = useState({ subjects: [] });
    const [view, setView] = useState('subjects');
    const [activeSubjectId, setActiveSubjectId] = useState(null);
    const [activeSheetIdx, setActiveSheetIdx] = useState(0);

    const [editingSubject, setEditingSubject] = useState(null);
    const [editingSheet, setEditingSheet] = useState(null);
    const [showEquEditor, setShowEquEditor] = useState(false);
    const [equTab, setEquTab] = useState('Operators');
    const [latexCode, setLatexCode] = useState('');
    const [equPreview, setEquPreview] = useState('');
    const [mceError, setMceError] = useState('');
    const [showQuestionModal, setShowQuestionModal] = useState(false);
    const [showGuide, setShowGuide] = useState(false);

    // First-launch guide: shows automatically once per browser, then only on request via the "?" button.
    useEffect(() => {
        try {
            if (!localStorage.getItem('wb_guide_seen')) {
                setShowGuide(true);
                localStorage.setItem('wb_guide_seen', 'true');
            }
        } catch { /* localStorage unavailable — skip auto-show, "?" button still works */ }
    }, []);

    // Refs
    const editorRef = useRef(null);
    const equSetterRef = useRef(null);
    const editorWrapRef = useRef(null);
    const questionEditorRef = useRef(null);
    const [questionPanelHeight, setQuestionPanelHeight] = useState(null); // null = use CSS default (38vh)
    const resizeStateRef = useRef(null);
    const idsRef = useRef({});
    // Storage key – we lock it only after resolving the final user
    const storageKeyRef = useRef(null);
    // Timeout ID for status messages
    const statusTimerRef = useRef(null);
    // Timeout ID for the save indicator
    const saveTimerRef = useRef(null);

    const activeSubject = data.subjects.find(s => s.id === activeSubjectId) || null;
    const activeSheet = activeSubject ? activeSubject.sheets[activeSheetIdx] : null;

    // --- Helper to set sync status (clears previous timer) ---
    const setSyncStatusWithTimeout = (msg, delay = 2000) => {
        if (statusTimerRef.current) clearTimeout(statusTimerRef.current);
        setSyncStatus(msg);
        statusTimerRef.current = setTimeout(() => {
            setSyncStatus('');
            statusTimerRef.current = null;
        }, delay);
    };

    // --- Firebase Auth state detection (replaces old qb_global_user/pin) ---
    useEffect(() => {

                    setUserTrack((profile && profile.track) || null);

                    return;
                }
                let pinResult = null;
                try { pinResult = await resolvePinSession(); } catch (e) { /* ignore */ }

                    setUserId(pinResult.profile.username);

                    setIsHubLogin(false);

                    setUserTrack(null);

    // --- Resolve storage key (only once, after we know the user) ---
    const resolveStorageKey = useCallback(() => {
        if (storageKeyRef.current) return storageKeyRef.current;

        // Determine effective user: signed-in uid takes priority over manual input
        const effectiveUser = (isHubLogin && uid) ? uid : (userId || 'default');
        const key = 'wb_data_' + effectiveUser;

        // If signed in and we previously had a default key, migrate its content
        if (isHubLogin && uid) {
            const defaultKey = 'wb_data_default';
            const hasDefault = localStorage.getItem(defaultKey) !== null;
            const hasUser = localStorage.getItem(key) !== null;
            if (hasDefault && !hasUser) {
                try {
                    const defaultData = JSON.parse(localStorage.getItem(defaultKey));
                    localStorage.setItem(key, JSON.stringify(defaultData));

                } catch (e) {}

                    setSyncStatusWithTimeout(starterSubjects.length ? '📓 Starter content added' : '📓 Ready', 2500);

                const key = storageKeyRef.current;
                if (key) localStorage.setItem(key, JSON.stringify(cloudData));
                setSyncStatusWithTimeout('☁️ Restored from cloud', 2000);
            } else {
                setSyncStatusWithTimeout('☁️ No cloud data found', 3000);
            }
        }).catch(err => {
            setSyncStatusWithTimeout('⚠ Restore failed', 3000);
            console.warn(err);
        });
    };

    // --- Render ---
    return (
        <React.Fragment>
            <div className="toolbar">
                <span className="logo">📓 Practice Workbooks</span>
                <span className="spacer" />
                {!isHubLogin && (
                    <React.Fragment>
                        <input value={userId} onChange={e => setUserId(e.target.value)} placeholder="Your name / ID (local only)" style={{ width: 160 }} />
                        <a href="index.html" className="signin-hint" title="Sign in to sync across devices" style={{ fontSize: '0.8rem', color: 'var(--text-secondary)' }}>Sign in to sync ↗</a>
                    </React.Fragment>
                )}
                <button className="guide-btn" onClick={() => setShowGuide(true)} title="How this works">?</button>
                <button onClick={() => setDarkMode(!darkMode)}>{darkMode ? '☀️' : '🌙'}</button>
                <button onClick={exportJSON}>📤 Export JSON</button>
                <button onClick={() => document.getElementById('importInput')?.click()}>📥 Import JSON</button>
                <input id="importInput" type="file" accept=".json" style={{ display: 'none' }} onChange={importJSON} />
                <button onClick={exportPDF}>📄 PDF</button>
                <button onClick={manualPush} title="Push to cloud">☁️ Sync Now</button>
                <button onClick={pullFromCloud} title="Restore from cloud (overwrites local)">⬇️ Restore from Cloud</button>
                {saveStatus && <span className="save-indicator">{saveStatus}</span>}
                {syncStatus && <span className={'sync-indicator' + (syncStatus.includes('⚠') ? ' error' : '')}>{syncStatus}</span>}
            </div>

            {isHubLogin && (
                <div className="logged-in-bar"><span>👤 Logged in as <strong>{userId}</strong></span></div>
            )}

            <div className="breadcrumb">
                <span className="crumb" onClick={() => { setView('subjects'); setActiveSubjectId(null); }}>Subjects</span>
                {activeSubject && (<React.Fragment><span className="sep">›</span><span className="current">{activeSubject.name}</span></React.Fragment>)}
            </div>

            {view === 'subjects' && (
                <div className="content-area" style={{ flex: 1, overflowY: 'auto' }}>
                    {data.subjects.length === 0 && (
                        <div className="empty-state">No subjects yet. Create one to start — e.g. "Accounting" or "Banking Operations."</div>
                    )}
                    <div className="grid">
                        {data.subjects.map(s => (
                            <div key={s.id} className="card" onClick={() => openSubject(s.id)}>
                                {editingSubject && editingSubject.id === s.id ? (
                                    <input autoFocus value={editingSubject.value} onClick={e => e.stopPropagation()}
                                        onChange={e => setEditingSubject({ ...editingSubject, value: e.target.value })}
                                        onBlur={() => { renameSubject(s.id, editingSubject.value); setEditingSubject(null); }}
                                        onKeyDown={e => { if (e.key === 'Enter') { renameSubject(s.id, editingSubject.value); setEditingSubject(null); } }} />
                                ) : (
                                    <div className="card-title" onDoubleClick={e => { e.stopPropagation(); setEditingSubject({ id: s.id, value: s.name }); }}>{s.name}</div>
                                )}
                                <div className="card-meta">{s.sheets.length} sheet{s.sheets.length !== 1 ? 's' : ''}</div>
                                <div className="card-actions">
                                    <button onClick={e => { e.stopPropagation(); setEditingSubject({ id: s.id, value: s.name }); }}>Rename</button>
                                    <button className="danger" onClick={e => { e.stopPropagation(); deleteSubject(s.id); }}>Delete</button>
                                </div>
                            </div>
                        ))}
                        <div className="card new-card" onClick={addSubject}>+ New Subject</div>
                    </div>
                </div>
            )}

            {mceError && (
                <div style={{ background: '#fee2e2', color: '#991b1b', padding: '10px 20px', fontSize: '0.85rem', borderBottom: '1px solid #fca5a5' }}>
                    ⚠️ {mceError}
                </div>
            )}

            <div className="sheet-tabs-bar" style={{ display: (view === 'editor' && activeSubject) ? 'flex' : 'none' }}>
                {activeSubject && activeSubject.sheets.map((sh, idx) => (
                    <div key={sh.id} className={'sheet-tab' + (idx === activeSheetIdx ? ' active' : '')} onClick={() => setActiveSheetIdx(idx)}>
                        {editingSheet === idx ? (
                            <input autoFocus value={sh.name} onClick={e => e.stopPropagation()}
                                onChange={e => renameSheet(idx, e.target.value)}
                                onBlur={() => setEditingSheet(null)}
                                onKeyDown={e => { if (e.key === 'Enter') setEditingSheet(null); }} />
                        ) : (
                            <span onDoubleClick={e => { e.stopPropagation(); setEditingSheet(idx); }}>{sh.name}</span>
                        )}
                        {activeSubject.sheets.length > 1 && (
                            <span className="close-x" onClick={e => { e.stopPropagation(); deleteSheet(idx); }}>✕</span>
                        )}
                    </div>
                ))}
                {activeSubject && <button className="sheet-tab-add" onClick={addSheet} title="Add sheet">+</button>}
            </div>

            {view === 'editor' && activeSheet && !activeSheet.prompt && (
                <div className="question-add-row">
                    <button onClick={openQuestionModal}>+ Add Question</button>
                </div>
            )}

            {view === 'editor' && activeSheet && activeSheet.prompt && activeSheet.promptVisible && (
                <div className="question-panel">
                    <div className="question-panel-header">
                        <span className="qp-label">📄 Question</span>
                        <button onClick={openQuestionModal}>Edit</button>
                        <button onClick={toggleQuestionVisible}>Hide</button>
                    </div>
                    <div id="question-panel-body-el" className="question-panel-body"
                        style={questionPanelHeight ? { height: questionPanelHeight + 'px', maxHeight: questionPanelHeight + 'px' } : undefined}
                        dangerouslySetInnerHTML={{ __html: window.DOMPurify ? DOMPurify.sanitize(activeSheet.prompt) : '' }} />
                    <div className="question-panel-resize-handle" onMouseDown={startResizeQuestion} onTouchStart={startResizeQuestion} title="Drag to resize">
                        <div className="grip"></div>
                    </div>
                </div>
            )}

            {view === 'editor' && activeSheet && activeSheet.prompt && !activeSheet.promptVisible && (
                <div className="question-panel-hidden-strip" onClick={toggleQuestionVisible}>
                    ▸ Show Question
                </div>
            )}

            <div className="editor-wrap" style={{ display: (view === 'editor' && activeSubject) ? 'flex' : 'none' }} ref={editorWrapRef}>
                <div className="editor-fill">
                    <textarea id="wb-rich-editor"></textarea>
                </div>
            </div>

            {view === 'editor' && activeSheet && activeSheet.solution && !activeSheet.solutionVisible && (
                <div className="solution-panel-hidden-strip" onClick={toggleSolutionVisible}>
                    🔒 Show Solution
                </div>
            )}

            {view === 'editor' && activeSheet && activeSheet.solution && activeSheet.solutionVisible && (
                <div className="solution-panel">
                    <div className="solution-panel-header">
                        <span className="sp-label">✅ Solution</span>
                        <button onClick={toggleSolutionVisible}>Hide</button>
                    </div>
                    <div className="solution-panel-body"
                        dangerouslySetInnerHTML={{ __html: window.DOMPurify ? DOMPurify.sanitize(activeSheet.solution) : '' }} />
                </div>
            )}

            {view === 'editor' && !activeSubject && (
                <div className="empty-state">This subject couldn't be found. <span className="crumb" onClick={() => setView('subjects')}>Go back to Subjects</span></div>
            )}

            {equationModal}
            {questionModal}
            {guideModal}
        </React.Fragment>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
