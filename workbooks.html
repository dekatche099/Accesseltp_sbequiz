<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Practice Workbooks</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.3/tinymce.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<style>

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

function newId() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
function newSheet(name) { return { id: newId(), name: name, content: '' }; }
function newSubject(name) { return { id: newId(), name, sheets: [newSheet('Sheet 1')] }; }

const EQU_TABS = {
    Operators: ['\\cdot', '\\times', '*', '\\div', '\\diamond', '\\pm', '\\mp', '\\oplus', '\\ominus', '\\otimes',
        '\\oslash', '\\odot', '\\circ', '\\bullet', '\\asymp', '\\equiv', '\\subseteq', '\\supseteq', '\\le', '\\ge',
        '\\preccurlyeq', '\\succcurlyeq', '\\sim', '\\simeq', '\\approx', '\\subset', '\\supset', '\\ll', '\\gg', '\\prec',
        '\\succ', '\\infty', '\\in', '\\ni', '\\forall', '\\exists', '\\neq'],
    Arrows: ['\\leftarrow', '\\rightarrow', '\\uparrow', '\\downarrow', '\\leftrightarrow', '\\Leftarrow', '\\Rightarrow',
        '\\Uparrow', '\\Downarrow', '\\Leftrightarrow', '\\mapsto', '\\hookleftarrow', '\\hookrightarrow', '\\nearrow',
        '\\searrow', '\\swarrow', '\\nwarrow', '\\longrightarrow', '\\longleftarrow', '\\rightharpoonup'],
    'Greek symbols': ['\\alpha', '\\beta', '\\gamma', '\\delta', '\\epsilon', '\\zeta', '\\eta', '\\theta', '\\iota',
        '\\kappa', '\\lambda', '\\mu', '\\nu', '\\xi', '\\pi', '\\rho', '\\sigma', '\\tau', '\\upsilon', '\\phi',
        '\\chi', '\\psi', '\\omega', '\\Gamma', '\\Delta', '\\Theta', '\\Lambda', '\\Xi', '\\Pi', '\\Sigma',
        '\\Upsilon', '\\Phi', '\\Psi', '\\Omega'],
    Advanced: ['\\sum', '\\prod', '\\int', '\\oint', '\\partial', '\\nabla', '\\sqrt{}', '\\frac{}{}', '\\lim',
        '\\binom{}{}', '^{}', '_{}', '\\overline{}', '\\underline{}', '\\vec{}', '\\hat{}', '\\dot{}', '\\ldots',
        '\\cdots', '\\prime']
};

function App() {
    // ----- all state and refs exactly as before -----
    const [darkMode, setDarkMode] = useState(() => localStorage.getItem('wb_dark') === 'true');
    const [userId, setUserId] = useState(() => localStorage.getItem('wb_user') || '');
    const [pin, setPin] = useState('');
    const [isHubLogin, setIsHubLogin] = useState(false);
    const [syncStatus, setSyncStatus] = useState('');
    const [saveStatus, setSaveStatus] = useState('');
    const [dataVersion, setDataVersion] = useState(0);

    const [data, setData] = useState({ subjects: [] });
    const [view, setView] = useState('subjects');
    const [activeSubjectId, setActiveSubjectId] = useState(null);
    const [activeSheetIdx, setActiveSheetIdx] = useState(0);
    const [editingSubject, setEditingSubject] = useState(null);
    const [editingSheet, setEditingSheet] = useState(null);
    const [showEquEditor, setShowEquEditor] = useState(false);
    const [equTab, setEquTab] = useState('Operators');
    const [latexCode, setLatexCode] = useState('');
    const [equPreview, setEquPreview] = useState('');

    const editorRef = useRef(null);
    const equSetterRef = useRef(null);
    const editorWrapRef = useRef(null);
    const activeSubject = data.subjects.find(s => s.id === activeSubjectId) || null;
    const activeSheet = activeSubject ? activeSubject.sheets[activeSheetIdx] : null;
    const idsRef = useRef({});
    useEffect(() => { idsRef.current = { activeSubjectId, activeSheetIdx }; }, [activeSubjectId, activeSheetIdx]);

    // ---- Hub login ----
    useEffect(() => {
        const name = localStorage.getItem('qb_global_user');
        const hubPin = localStorage.getItem('qb_global_pin');
        if (name && hubPin) { setIsHubLogin(true); setUserId(name); setPin(hubPin); }
    }, []);
    useEffect(() => { if (userId) localStorage.setItem('wb_user', userId); }, [userId]);
    useEffect(() => { localStorage.setItem('wb_dark', darkMode); document.body.className = darkMode ? 'dark' : ''; }, [darkMode]);

    // ---- push to cloud helper ----
    const pushToCloud = useCallback((subjectsData) => {
        if (userId && /^\d{4}$/.test(pin)) {
            import('./workbook-sync.js').then(({ pushWorkbooksToCloud }) => {
                pushWorkbooksToCloud(userId, subjectsData);
            }).catch(() => {});
        }
    }, [userId, pin]);

    /* ========== 🔧 FIXED LOAD LOGIC ========== */
    useEffect(() => {
        const storageKey = 'wb_data_' + (userId || 'default');
        let localData = null;
        let localLastModified = 0;

        // 1. Read local storage
        try {
            const saved = localStorage.getItem(storageKey);
            if (saved) {
                localData = JSON.parse(saved);
                localLastModified = localData._lastModified || 0;
                delete localData._lastModified;
            }
        } catch { /* ignore */ }

        // 2. Set UI from local storage immediately (fast)
        const initialSubjects = localData && localData.subjects ? localData.subjects : [];
        setData({ subjects: initialSubjects });
        setView('subjects');
        setActiveSubjectId(null);
        setDataVersion(v => v + 1);

        // 3. If no PIN, we're done – local storage is the source of truth
        if (!userId || !/^\d{4}$/.test(pin)) {
            setSyncStatus('');
            return;
        }

        // 4. Check cloud, but be careful not to overwrite local with empty cloud data
        setSyncStatus('☁️ Checking…');
        import('./workbook-sync.js').then(({ verifyAndPullWorkbooks }) => {
            verifyAndPullWorkbooks(userId, pin).then(result => {
                if (!result.ok) { setSyncStatus('⚠ ' + result.reason); return; }

                const cloudData = result.data;
                const cloudUpdatedAt = result.updatedAt || 0;

                const localHasData = localData && localData.subjects && localData.subjects.length > 0;
                const cloudHasData = cloudData && Array.isArray(cloudData) && cloudData.length > 0;

                // CASE 1: Cloud is newer AND has data → pull cloud (overwrites local)
                if (cloudHasData && cloudUpdatedAt > localLastModified) {
                    setData({ subjects: cloudData });
                    localStorage.setItem(storageKey, JSON.stringify({ subjects: cloudData, _lastModified: cloudUpdatedAt }));
                    setSyncStatus('☁️ Synced (cloud newer)');
                }
                // CASE 2: Local has data, cloud has no data (or is older) → push local to cloud
                else if (localHasData && (!cloudHasData || cloudUpdatedAt <= localLastModified)) {
                    // Push local data to cloud so other devices see it
                    pushToCloud(userId, localData.subjects);
                    setSyncStatus('☁️ Synced (local pushed)');
                }
                // CASE 3: Local empty, cloud has data → pull cloud (restore from cloud)
                else if (!localHasData && cloudHasData) {
                    setData({ subjects: cloudData });
                    localStorage.setItem(storageKey, JSON.stringify({ subjects: cloudData, _lastModified: cloudUpdatedAt }));
                    setSyncStatus('☁️ Synced (restored from cloud)');
                }
                // CASE 4: Both empty → nothing to do
                else {
                    setSyncStatus('☁️ Synced (no data)');
                }
                setDataVersion(v => v + 1);
            }).catch(() => setSyncStatus('⚠ Sync unavailable'));
        }).catch(() => setSyncStatus('⚠ Sync unavailable'));
    }, [userId, pin, pushToCloud]);

    /* ---- Persist locally + push to cloud (unchanged) ---- */
    useEffect(() => {
        const storageKey = 'wb_data_' + (userId || 'default');
        const now = Date.now();
        const dataToSave = { ...data, _lastModified: now };
        localStorage.setItem(storageKey, JSON.stringify(dataToSave));
        setSaveStatus('💾 Saved ' + new Date().toLocaleTimeString());
        const t = setTimeout(() => setSaveStatus(''), 3000);
        const timer = setTimeout(() => {
            pushToCloud(data.subjects);
        }, 600);
        return () => { clearTimeout(t); clearTimeout(timer); };
    }, [data, userId, pushToCloud]);

    // ----- the rest of the app (TinyMCE, equation modal, CRUD, exports) is identical to the previous version -----
    // I'm omitting it here for brevity, but it must be copied from your current file.
    // Ensure you paste the complete function body (including all handlers) from your existing file.
    // The only change is the load logic above.

    // (All other code from your current file goes here unchanged.)
    return ( ... ); // your existing JSX
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
